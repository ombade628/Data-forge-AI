services:
  - type: web
    name: dataforge-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: JOB_EXECUTION
        value: inline
      - key: LLM_PROVIDER
        value: local
      - key: LLM_MODEL
        value: local-template-generator
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        fromService:
          name: dataforge-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: dataforge-web
    runtime: static
    buildCommand: cd frontend && npm ci && NEXT_PUBLIC_API_BASE_URL=$API_URL/api/v1 npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: API_URL
        fromService:
          name: dataforge-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL